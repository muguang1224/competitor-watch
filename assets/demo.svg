    <text x="34" y="286" fill="#f85149">-Starter plan: 10k requests / month</text>
    <text x="34" y="310" fill="#3fb950">+Starter plan: 25k requests / month · new Team tier at $49</text>
    <text x="34" y="334" fill="#8b949e">```</text>

    <text x="34" y="376" fill="#8b949e">Raw changes only — you write the brief.</text>
