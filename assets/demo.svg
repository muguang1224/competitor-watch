    <text x="34" y="106" fill="#7ee787">2 changed / 4 sources -&gt; brief.md</text>

    <text x="34" y="146" fill="#f0f6fc" font-weight="700">## Ollama — NEW ITEMS</text>
    <text x="34" y="172" fill="#c9d1d9">- </text>
    <text x="58" y="172" fill="#f0f6fc" font-weight="700">v0.5.0</text>
    <text x="126" y="172" fill="#8b949e">(2026-10-13) — https://github.com/ollama/ollama/releases/tag/v0.5.0</text>
    <text x="34" y="196" fill="#c9d1d9">- </text>
    <text x="58" y="196" fill="#f0f6fc" font-weight="700">v0.4.9</text>
    <text x="126" y="196" fill="#8b949e">(2026-10-11) — https://github.com/ollama/ollama/releases/tag/v0.4.9</text>

    <text x="34" y="236" fill="#f0f6fc" font-weight="700">## Vendor pricing page — CHANGED</text>
